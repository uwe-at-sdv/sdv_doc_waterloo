# Waterloo MCP server configuration for streamable-http transport.
#
# Use this file with:
#   wtrl_mcp --config @main/src/sdv/doc/waterloo/etc/wtrl_mcp.no_dns_rb_protect.http.toml
#
# The roots and logging config_path are resolved relative to this file.

[server]
# identity = "wtrl_mcp"
transport = "streamable-http"
host = "0.0.0.0"
port = 13316
streamable_http_path = "/mcp"

[security]
# For this configuration allowed_hosts and allowed_origins
# are disabled. While this is generally not advisable, it can
# be necessary for hosted MCP frontends or marketplaces that
# probe multiple candidate ports before connecting.
#
# allowed_hosts = ["127.0.0.1:13316", "localhost:13316"]
# This matters for the browser-based Inspector, which connects
# via CORS. Replace "gilgamesh" with your host name if you want
# to try it locally. The origin list is not relevant for VSCode.
# allowed_origins = ["http://localhost:6274", "http://gilgamesh:6274"]

[logging]
level = "INFO"
access_log = true
config_path = "logging.toml"

[[roots]]
# Possible kind at current state of development: wtrl-json.
path = "../mcp/doc-json/wtrl_mcp.wtrl.core.rfc-2119.json"
label = "Waterloo MCP Server and Tool set Reference"
enabled = true
kind = "wtrl-json"

