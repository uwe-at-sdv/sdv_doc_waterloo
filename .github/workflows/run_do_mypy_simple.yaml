name: Run do_mypy_simple

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mypy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show workspace layout
        run: |
          pwd
          ls -la
          ls -la package_main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install mypy
        run: python -m pip install --upgrade pip mypy

      - name: Run do_mypy_simple.sh
        run: ./do_mypy_simple.sh

      - name: Check generated type-checking files
        run: git diff --exit-code -- doc/source/type_checking_report.txt doc/source/type_checking_exceptions.txt doc/source/type_checking_files.txt
