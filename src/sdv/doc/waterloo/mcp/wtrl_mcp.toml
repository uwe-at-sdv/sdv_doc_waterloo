# Waterloo MCP server configuration template
#
# Save this as wtrl_mcp.toml next to wtrl_server.py and edit it as needed.

[server]
# transport = "stdio"
transport = "streamable-http"
# host = "127.0.0.1"
host = "127.0.0.1"
# port = 8000
port = 13316
# streamable_http_path = "/mcp"
streamable_http_path = "/mcp"

[security]
# allowed_hosts = ["127.0.0.1:8000"]
# Prefer explicit host:port entries, e.g. ["127.0.0.1:13316", "localhost:13316"].
allowed_hosts = ["127.0.0.1:13316", "localhost:13316"]
# allowed_origins = ["http://localhost:6274"]
# Prefer explicit origins, e.g. ["http://localhost:6274", "http://gilgamesh:6274"].
# Wildcard support is implementation/version dependent; assume exact matches unless verified.
allowed_origins = ["http://gilgamesh:6274"]

# Example profiles (copy/paste into active values above):
# Dev profile (Inspector + local VS Code):
# allowed_hosts = ["127.0.0.1:13316", "localhost:13316"]
# allowed_origins = ["http://localhost:6274", "http://gilgamesh:6274"]
#
# Prod profile (strict, no browser tooling):
# allowed_hosts = ["mcp.example.internal:443"]
# allowed_origins = ["https://vscode.example.internal"]

[logging]
# Provide either level and access_log, or config_path.
level = "INFO"
access_log = true
# config_path = "package_main/src/sdv/doc/waterloo/mcp/logging.toml"

[[roots]]
# Possible kind at current state of development: wtrl-json.
path = "doc-json/wtrl_mcp.wtrl.core.rfc-2119.json"
label = "Waterloo MCP Server and Toolset Reference"
enabled = true
kind = "wtrl-json"

[[roots]]
# Possible kind at current state of development: wtrl-json.
path = "doc-json/docitem_helper.wtrl.core.rfc-2119.json"
label = "Example docstrings: Module docitem_helper"
enabled = true
kind = "wtrl-json"

