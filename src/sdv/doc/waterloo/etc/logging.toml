# Waterloo MCP logging configuration template.
#
# This file is read by wtrl_server.py and passed to uvicorn as a logging
# dictionary. The active configuration below logs to the terminal. A commented
# syslog variant is included further down.
#
# Common values:
# - version = 1 is required by logging.config.dictConfig.
# - disable_existing_loggers = false keeps unrelated loggers usable.
# - formatters define the text layout for regular and access logs.
# - handlers define where the log records go.
# - loggers define the Uvicorn logger tree and the Waterloo logger tree.
# - root is the fallback logger for records that do not match a named logger.
# - The dictConfig key "()" is used for formatter factories such as the
#   Uvicorn formatter classes below.

version = 1
disable_existing_loggers = false

[formatters.default]
"()" = "sdv.doc.waterloo.mcp.wtrl_logging.GroupingFormatter"
fmt = "%(asctime)s %(levelprefix)s [%(wtrl_request_id)s] %(message)s [%(funcName)s]"
datefmt = "%Y-%m-%dT%H:%M:%S"
use_colors = true
timestamp_window = 0.5

[formatters.access]
"()" = "sdv.doc.waterloo.mcp.wtrl_logging.GroupingAccessFormatter"
fmt = '%(asctime)s %(levelprefix)s [%(wtrl_request_id)s] %(client_addr)s "%(request_line)s" %(status_code)s [%(funcName)s]'
datefmt = "%Y-%m-%dT%H:%M:%S"
use_colors = true

[handlers.default]
class = "logging.StreamHandler"
formatter = "default"
stream = "ext://sys.stderr"

[handlers.access]
class = "logging.StreamHandler"
formatter = "access"
stream = "ext://sys.stdout"

[formatters.waterloo]
"()" = "sdv.doc.waterloo.mcp.wtrl_logging.GroupingFormatter"
fmt = "%(asctime)s %(levelprefix)s [%(wtrl_request_id)s] WTRL %(message)s"
datefmt = "%Y-%m-%dT%H:%M:%S"
use_colors = true
timestamp_window = 0.5

[handlers.waterloo]
class = "logging.StreamHandler"
formatter = "waterloo"
stream = "ext://sys.stderr"

[loggers.uvicorn]
level = "INFO"
handlers = ["default"]
propagate = false

[loggers."uvicorn.error"]
level = "INFO"
handlers = ["default"]
propagate = false

[loggers."uvicorn.access"]
level = "INFO"
handlers = ["access"]
propagate = false

[loggers."wtrl_mcp"]
level = "INFO"
handlers = ["waterloo"]
propagate = false

[root]
level = "INFO"
handlers = ["default"]
