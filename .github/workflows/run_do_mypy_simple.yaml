name: Run do_mypy_simple

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mypy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show workspace layout
        run: |
          pwd
          ls -la
          ls -la src
          ls -la doc/source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install mypy
        run: python -m pip install --upgrade pip mypy

      - name: Run do_mypy_simple.sh
        run: ./do_mypy_simple.sh

      - name: Show mypy report on failure
        if: failure()
        run: |
          if [ -f doc/source/type_checking_report.txt ]; then
            echo "=== type_checking_report.txt ==="
            cat doc/source/type_checking_report.txt
          else
            echo "type_checking_report.txt not found"
          fi

      - name: Show generated type-checking diff
        if: always()
        run: git diff -- doc/source/type_checking_report.txt doc/source/type_checking_exceptions.txt doc/source/type_checking_files.txt
