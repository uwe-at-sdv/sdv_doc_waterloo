# Waterloo MCP server configuration for stdio transport.
#
# Relative root paths are resolved relative to this file.
#
# This is the recommended VSCode configuration for the Waterloo
# MCP stdio provider. Copy it outside the package for your own
# setup and fill in the [[roots]] section. Add one [[roots]]
# block per document. Absolute paths are recommended for long-
# lived setups.
#
# VSCode:
#   Put the path to this TOML file into "MCP Config Path".
#   The extension uses it to start the stdio provider.

[server]
# identity = "wtrl_mcp"
transport = "stdio"
# host, port, and streamable_http_path are only used for streamable-http.

[security]
# Browser and host allowlists are only used for streamable-http.

[logging]
# Uvicorn accepts these log levels:
# 'DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'.
# Use logging.toml for console output or logging.syslog.toml for syslog.
level = "INFO"
access_log = true
# This file is loaded by uvicorn as a logging config dictionary.
# For the config file format, see: https://uvicorn.dev/concepts/logging/
config_path = "logging.syslog.toml"

[[roots]]
# Waterloo documentation
path = "../mcp/doc-json/docitem_helper.wtrl.core.rfc-2119.json"
label = "Waterloo MCP Server and Tool set Reference"
enabled = true
kind = "wtrl-json"

[[roots]]
# Documentation on the MCP-server
path = "../mcp/doc-json/wtrl_mcp.wtrl.core.rfc-2119.json"
label = "Waterloo MCP Server and Tool set Reference"
enabled = true
kind = "wtrl-json"
